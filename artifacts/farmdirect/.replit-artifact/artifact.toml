kind = "web"
previewPath = "/"
title = "FarmDirect"
description = "A marketplace that helps farmers sell fresh produce directly to households, restaurants, retailers, and wholesalers, with product listings, carts, orders, reviews, and role-specific management."
version = "1.0.0"
id = "artifacts/farmdirect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22556

[services.development]
run = "pnpm --filter @workspace/farmdirect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farmdirect", "run", "build" ]
serve = "static"
publicDir = "artifacts/farmdirect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22556"
BASE_PATH = "/"
